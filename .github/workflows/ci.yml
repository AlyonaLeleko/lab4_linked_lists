name: Linked Lists CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libgtest-dev valgrind doxygen
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Valgrind
        run: printf '0\n' | valgrind --error-exitcode=1 --leak-check=full ./build/lab4
      - name: Doxygen
        run: doxygen Doxyfile
